apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  replicas: 1
  dataVolumeCapacity: 10Gi
  image:
    application: confluentinc/cp-server:8.3.2
    init: confluentinc/confluent-init-container:3.3.1
  podTemplate:
    resources:
      requests: {cpu: 200m, memory: 512Mi}
    podSecurityContext: {fsGroup: 1000, runAsUser: 1000, runAsNonRoot: true}
---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 1
  dataVolumeCapacity: 10Gi
  image:
    application: confluentinc/cp-server:8.3.2
    init: confluentinc/confluent-init-container:3.3.1
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
  configOverrides:
    server:
      - "confluent.license.topic.replication.factor=1"
      - "confluent.metrics.reporter.topic.replicas=1"
      - "confluent.tier.metadata.replication.factor=1"
      - "confluent.metadata.topic.replication.factor=1"
      - "confluent.balancer.topic.replication.factor=1"
      - "confluent.security.event.logger.exporter.kafka.topic.replicas=1"
      - "event.logger.exporter.kafka.topic.replicas=1"
      - "offsets.topic.replication.factor=1"
      - "confluent.cluster.link.enable=true"
      - "password.encoder.secret=secret"
  podTemplate:
    resources:
      requests: {cpu: 200m, memory: 512Mi}
    podSecurityContext: {fsGroup: 1000, runAsUser: 1000, runAsNonRoot: true}
  metricReporter:
    enabled: true
---
apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-schema-registry:8.3.2
    init: confluentinc/confluent-init-container:3.3.1
  podTemplate:
    resources: {requests: {cpu: 100m, memory: 256Mi}}
    podSecurityContext: {fsGroup: 1000, runAsUser: 1000, runAsNonRoot: true}
---
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent
spec:
  replicas: 1
  dataVolumeCapacity: 10Gi
  image:
    application: confluentinc/cp-enterprise-control-center:8.3.2
    init: confluentinc/confluent-init-container:3.3.1
  configOverrides:
    server:
      - confluent.controlcenter.command.topic.replication=1
      - confluent.controlcenter.replication.factor=1
      - confluent.metrics.reporter.topic.replicas=1
      - confluent.metrics.topic.replication=1
      - confluent.monitoring.interceptor.topic.replication=1
      - confluent.controlcenter.internal.topics.replication=1
  externalAccess:
    type: loadBalancer
    loadBalancer:
      domain: minikube.domain
  dependencies:
    schemaRegistry:
      url: http://schemaregistry.confluent.svc.cluster.local:8081
  podTemplate:
    resources: {requests: {cpu: 500m, memory: 512Mi}}
    podSecurityContext: {fsGroup: 1000, runAsUser: 1000, runAsNonRoot: true}
